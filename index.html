<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>NCKU APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：手機單欄。灰色底、米色標題列、白色卡片，沿用 Canva 設計稿的配色與圖示風格 */
:root{
  --bg:#5a5954;         /* 主背景灰，略帶橄欖色調 */
  --bg-line:#4a4945;    /* 列與列之間的分隔 */
  --cream:#eceae1;      /* 標題列、按鈕底 */
  --olive:#a39d7e;      /* 標題字、強調 */
  --olive-deep:#6f6a50; /* 強調色上的文字 */
  --ink:#1f1f1d;
  --card:#ffffff;
  --mist:#c5ccd6;       /* 提示文字、壘包底色 */
  --muted:#77766f;
  --on-bg:#ffffff;      /* 灰底上的文字 */
  --pin:#d2483c;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-latin:"Lexend","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:440px;margin:0 auto;min-height:100%;padding-bottom:110px;position:relative}
.top-gap{height:28px}

/* 標題列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:84px}
.bar h1{flex:1;margin:0;color:var(--olive);font-weight:900;font-size:clamp(28px,8.6vw,38px);letter-spacing:.06em;line-height:1.1;text-wrap:balance;min-width:0}
.bar-icon{width:52px;height:52px;flex:none;color:var(--ink)}
.home-btn{width:64px;height:60px;flex:none;border:0;background:none;padding:0;color:var(--ink);border-radius:12px}
.bar svg,.tile svg{width:100%;height:100%}

.wrap{padding:24px 16px 0;display:flex;flex-direction:column;gap:20px}
.section-title{color:var(--on-bg);font-weight:700;font-size:18px;margin:6px 0 -6px;letter-spacing:.04em}
.hint{color:var(--mist);font-size:14px;margin:0}

/* 首頁功能格 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 16px;padding:40px 16px 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:none;padding:0;color:var(--on-bg)}
.tile-face{width:100%;aspect-ratio:1.75;background:var(--cream);border-radius:28px;display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.tile-face span{width:52%;height:84%;display:block}
.tile:active .tile-face{transform:scale(.95)}
.tile b{font-size:clamp(17px,5.4vw,22px);letter-spacing:.06em}

.yesterday{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;padding:44px 16px 0;align-items:center}
.y-photo{border:0;padding:0;aspect-ratio:2/3;width:100%;max-width:100%;overflow:hidden;background:
  radial-gradient(60% 18% at 70% 58%,rgba(244,196,160,.85),transparent 70%),
  radial-gradient(70% 20% at 30% 40%,rgba(236,206,170,.7),transparent 70%),
  linear-gradient(180deg,#a8c3c3 0%,#b9c3b6 38%,#e3c4a0 62%,#cfc0a3 100%)}
.y-photo img{width:100%;height:100%;object-fit:cover;display:block}
.y-text{color:var(--on-bg);font-family:var(--font-latin);font-weight:600;font-size:clamp(28px,8.5vw,38px);line-height:1.3;margin:0}
.y-cap{color:var(--cream);font-size:14px;margin-top:10px;font-family:var(--font-body);font-weight:400;line-height:1.5}

.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 220px + 16px));width:76px;height:76px;border-radius:50%;border:0;background:var(--cream);color:var(--olive);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.fab svg{width:40px;height:40px}

/* 共用元件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:700;padding:12px 20px;font-size:16px;text-decoration:none}
.btn.primary{background:var(--olive);color:#fff}
.btn.ghost{background:transparent;color:var(--on-bg);border:2px solid var(--cream)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.danger{background:#f3dedb;color:#9a2f25}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:22px;padding:18px 20px}
.empty{color:var(--cream);text-align:center;padding:28px 12px;border:2px dashed #78776f;border-radius:22px;line-height:1.7}
.back{color:var(--cream);text-decoration:none;font-weight:700;display:inline-flex;gap:6px;align-items:center;border:0;background:none;padding:0}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=time],input[type=date],textarea{border:1.5px solid #d9d7cd;border-radius:12px;padding:10px 12px;background:#fff;width:100%;min-width:0}
textarea{resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #d6d3c6;background:#fff;border-radius:999px;padding:6px 13px;font-size:14px}
.chip[aria-pressed=true]{background:var(--olive);border-color:var(--olive);color:#fff}

/* 記事本 */
.note-list{display:flex;flex-direction:column;gap:12px}
.note-item{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:20px;padding:16px 18px}
.note-item b{display:block;font-size:17px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item p{margin:0;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item small{display:block;color:var(--olive);margin-top:8px;font-size:12px;font-variant-numeric:tabular-nums}
.note-edit textarea{min-height:52vh;border:0;font-size:17px;line-height:1.75;padding:0}

/* 隨手拍 */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-grid button{border:0;padding:0;aspect-ratio:1;overflow:hidden;background:#6a6964;position:relative}
.photo-grid img{width:100%;height:100%;object-fit:cover;display:block}
.photo-grid small{position:absolute;left:6px;bottom:5px;color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.viewer img{width:100%;max-height:56vh;object-fit:contain;background:#222;border-radius:14px;display:block}

/* 訂飲料 */
.map{display:block;position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:#e9e7e2;color:inherit;text-decoration:none}
.map:active .map-pin{transform:translate(-50%,-100%)}
.map-art{position:absolute;inset:0;background:
  linear-gradient(28deg,transparent 46%,#fff 46%,#fff 50%,transparent 50%),
  linear-gradient(-40deg,transparent 60%,#fff 60%,#fff 63%,transparent 63%),
  linear-gradient(115deg,transparent 30%,#fff 30%,#fff 32.5%,transparent 32.5%),
  repeating-linear-gradient(60deg,#ecebe6 0 22px,#e2e0d9 22px 24px),#e9e7e2}
.map-pin{position:absolute;left:50%;top:50%;width:34px;height:46px;transform:translate(-50%,-92%);color:var(--pin)}
.map-info{position:absolute;left:12px;top:12px;right:12px;max-width:300px;background:#fff;border-radius:6px;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.18);font-size:13px;line-height:1.5;color:#555}
.map-info b{display:block;color:#222;font-size:14px;font-weight:500}
.map-info a{color:#1a73e8;text-decoration:none;font-weight:500}

.stores{display:flex;flex-direction:column;gap:6px;background:var(--bg-line);margin:0 -16px}
.store{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--cream);padding:12px 16px 12px 14px;border:0;text-align:left;width:100%}
.store .pin{width:44px;height:56px;color:var(--olive)}
.store[aria-current=true]{background:#f7f6f1}
.store[aria-current=true] .pin{color:var(--olive-deep)}
.store-name{font-size:clamp(24px,7.4vw,32px);font-weight:900;color:var(--olive-deep);line-height:1.15;letter-spacing:.04em}
.store-tag{font-size:clamp(14px,4.2vw,17px);font-weight:700;color:var(--olive-deep);opacity:.85}
.store-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{font-weight:700;color:var(--olive-deep);font-size:clamp(16px,4.8vw,21px);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu-btn{border:0;background:#fff;border-radius:999px;padding:6px 20px;font-weight:700;font-size:18px;color:var(--olive-deep)}

.order{background:var(--card);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.order header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.order header b{font-size:17px}
.order small{color:var(--muted);font-variant-numeric:tabular-nums}
.order ul{margin:0;padding-left:18px;color:#444;font-size:14px;line-height:1.6}

.menu-items{display:flex;flex-direction:column}
.cat{margin:0;padding:16px 2px 6px;font-size:14px;color:var(--olive-deep);letter-spacing:.08em;border-bottom:2px solid var(--olive);position:sticky;top:-20px;background:#fff;z-index:1}
.mi{border-bottom:1px solid #e7e4da}
.mi>button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:13px 2px;font-size:17px;text-align:left;gap:8px}
.mi>button span:last-child{font-variant-numeric:tabular-nums;color:var(--olive-deep);font-weight:700}
.mi-opts{display:grid;gap:12px;padding:4px 2px 16px}
.mi-opts h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.stepper{display:inline-flex;align-items:center;gap:4px;border:1.5px solid #d6d3c6;border-radius:999px}
.stepper button{border:0;background:none;width:36px;height:34px;font-size:20px}
.stepper output{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.cart{background:#f4f3ee;border-radius:16px;padding:12px 14px;display:grid;gap:10px;max-height:38vh;overflow:auto}
.cart-bar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:12px -18px calc(-24px - env(safe-area-inset-bottom,0px));padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -6px 14px rgba(0,0,0,.08);display:grid;gap:10px;z-index:2}
.cart-sum{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cart-toggle{border:0;background:none;padding:6px 0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;text-align:left}
.cart-toggle small{color:var(--muted);font-weight:500;margin-left:4px}
.chip small{font-size:11px;opacity:.8}
.order.pending{box-shadow:inset 0 0 0 2px var(--olive)}
.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:14px}
.cart-line small{color:var(--muted);display:block}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:50%}
.total{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}

/* 球經紀錄 */
.game-head{background:var(--card);border-radius:28px;padding:22px 24px;display:grid;gap:8px;min-height:180px}
.date-input{border:0!important;padding:0!important;font-size:clamp(34px,10.5vw,46px);font-weight:900;font-family:var(--font-body);font-variant-numeric:tabular-nums;background:transparent!important;letter-spacing:.01em;width:auto}
.date-big{display:flex;align-items:center;gap:8px;position:relative}
.date-big span{font-size:clamp(34px,10.5vw,46px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.date-big input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.game-head textarea{border:0;padding:0;font-size:18px;font-weight:700;color:var(--ink);min-height:96px;line-height:1.6}
.game-head textarea::placeholder{color:var(--mist)}
.stats{display:flex;gap:18px;color:var(--cream);font-size:14px;flex-wrap:wrap}
.stats b{font-size:20px;color:#fff;font-variant-numeric:tabular-nums;margin-left:4px}
.batter{display:grid;gap:6px}
.batter-label{display:flex;gap:10px;align-items:center;color:var(--cream);font-size:14px;padding:0 6px}
.batter-label input{background:transparent;border:0;border-bottom:1.5px solid #807f77;border-radius:0;color:#fff;padding:2px 2px;width:9em}
.batter-label input::placeholder{color:#a9a8a0}
.batter-label .x{color:var(--cream);margin-left:auto}
.sheet-row{background:var(--card);border-radius:30px;display:grid;grid-template-columns:42% repeat(4,1fr);overflow:hidden;min-height:132px}
.diamond{position:relative;padding:8px}
.diamond svg{width:100%;height:100%;display:block}
.diamond .q{position:absolute;width:50%;height:50%;border:0;background:none;padding:0}
.q1{right:0;top:0}.q2{right:0;bottom:0}.q3{left:0;bottom:0}.q4{left:0;top:0}
.ab{border:0;border-left:1.5px solid var(--ink);background:none;display:grid;place-items:center;font-size:clamp(26px,8vw,40px);font-weight:400;padding:0;font-variant-numeric:tabular-nums;color:var(--ink)}
.ab.set{font-size:clamp(15px,4.4vw,19px);font-weight:900;writing-mode:vertical-rl;letter-spacing:.12em}
.ab.hit{color:var(--olive-deep);background:#efede4}
.ab.on{color:#3d6a8c}
.ab.out{color:#9a948a}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.result-grid button{border:1.5px solid #e1ded3;background:#fff;border-radius:14px;padding:12px 0;font-weight:700;font-size:16px}
.result-grid .hit{color:var(--olive-deep);background:#f3f1ea}
.result-grid .on{color:#3d6a8c}
.result-grid .out{color:#8b857a}

/* 歷史紀錄 */
.hist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;width:100%;text-align:left;border:0;background:var(--card);border-radius:22px;padding:16px 20px;align-items:center}
.hist time{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;grid-row:span 2;line-height:1.1}
.hist time small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.hist p{margin:0;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .nums{font-size:14px;color:var(--olive-deep);font-weight:700}

/* 行事曆 */
.cal{background:var(--card);border-radius:24px;padding:14px 12px 16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-head b{font-size:20px;font-variant-numeric:tabular-nums}
.cal-head button{border:0;background:var(--cream);width:38px;height:38px;border-radius:50%;font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:12px;color:var(--muted);padding:4px 0}
.day{border:0;background:none;aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-size:16px;padding:0}
.day.other{color:#c3c1b8}
.day.today{box-shadow:inset 0 0 0 2px var(--olive)}
.day[aria-pressed=true]{background:var(--olive);color:#fff}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--olive)}
.dots i.g{background:#3d6a8c}
.day[aria-pressed=true] .dots i{background:#fff}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.ev time{font-variant-numeric:tabular-nums;color:var(--olive-deep);font-weight:700;min-width:3.2em}
.ev span{flex:1;min-width:0}

/* 底部面板與提示 */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet h3{margin:0 0 4px;font-size:22px}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.sheet-actions{display:grid;gap:10px}
.sheet-actions .btn{width:100%;justify-content:flex-start;padding:15px 20px;border-radius:16px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.copy-box{width:100%;min-height:140px;font-size:14px}
</style>

<div class="app" id="app">
  <div class="top-gap"></div>
  <div class="wrap"><div class="empty" style="text-align:left">
    <b style="font-size:18px">App 沒有啟動</b><br>
    這個開啟方式不能執行 App 的程式，常見於手機的「檔案」預覽、LINE 或雲端硬碟的預覽。<br>
    請改用 Safari 或 Chrome 開啟 App 的網址。
  </div></div>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';

/* ---------- 圖示（手繪線條風） ---------- */
const S = (inner, vb='0 0 64 64') => `<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  house: S('<path d="M6 32 L32 9 L58 32"/><path d="M12 27 V56 H52 V27"/><path d="M45 18 V9 H51 V24"/><path d="M20 56 V36 H31 V56"/><rect x="37" y="36" width="9" height="9"/>'),
  book: S('<path d="M5 20 Q18 13 32 20 Q46 13 59 20 V48 Q46 41 32 48 Q18 41 5 48 Z"/><path d="M32 20 V48"/><path d="M11 25 Q19 22 27 26 M11 31 Q19 28 27 32 M11 37 Q19 34 27 38 M37 26 Q45 22 53 25 M37 32 Q45 28 49 30"/><path d="M40 44 L58 24 L61 27 L43 47 L38 48 Z" fill="#fff"/>'),

  cup: S('<path d="M17 23 H47 L45 28 H19 Z"/><path d="M20 28 L24 57 H40 L44 28"/><path d="M21.5 38 H42.5"/><path d="M34 23 L39 6 L46 4"/><path d="M19 23 Q32 15 45 23"/>'),
  ball: S('<circle cx="32" cy="32" r="25"/><path d="M19 11 Q29 32 19 53 M45 11 Q35 32 45 53"/><path d="M19 17 l5 -1 M21 23 l5 -1 M22 29 l5 0 M22 35 l5 0 M21 41 l5 1 M19 47 l5 1 M45 17 l-5 -1 M43 23 l-5 -1 M42 29 l-5 0 M42 35 l-5 0 M43 41 l-5 1 M45 47 l-5 1" stroke-width="2"/>'),
  bats: S('<path d="M10 6 Q14 4 18 8 L50 52 L47 55 L14 13 Q8 10 10 6 Z"/><path d="M54 6 Q50 4 46 8 L14 52 L17 55 L50 13 Q56 10 54 6 Z"/><circle cx="50" cy="56" r="3"/><circle cx="14" cy="56" r="3"/>'),

  s.cats = cats; s.items = items; s.price = `${Math.min(...prices)}$-${Math.max(...prices)}$`;
});

   電腦多半用 IP 猜位置、容易偏掉，所以另外留一個固定在台南南區、東區一帶的連結 */
const TAINAN = '22.985,120.207,15z';
const nearUrl = s => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name);
const tainanUrl = s => `https://www.google.com/maps/search/${encodeURIComponent(s.name)}/@${TAINAN}`;

const resultKind = r => (RESULTS.find(x => x[0] === r) || [,''])[1];
/* 打席結果直接上到幾壘；出局類為 0 */
const BASES_FOR = { 一安:1, 二安:2, 三安:3, 全壘:4, 四壞:1, 觸身:1, 失誤:1 };
const lastAbIndex = r => { for (let k = r.ab.length - 1; k >= 0; k--) if (r.ab[k]) return k; return -1; };
const lastAb = r => { const k = lastAbIndex(r); return k >= 0 ? r.ab[k] : ''; };
function gameStats(g){
  let hits = 0, runs = 0;
  (g.rows||[]).forEach(r => { r.ab.forEach(a => { if (resultKind(a) === 'hit') hits++; }); if (r.bases[3]) runs++; });
  return { batters: (g.rows||[]).length, hits, runs };
}

function diamondSVG(b, last){
  const on = '#a39d7e', off = '#1f1f1d';
  const kind = resultKind(last);
  const fill = b[3] ? '#a39d7e' : kind === 'out' ? '#e6e8ec' : '#c5ccd6';
  const ink = b[3] ? '#ffffff' : { hit:'#6f6a50', on:'#2f5878', out:'#77766f' }[kind] || off;
  const edge = (x1,y1,x2,y2,a) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a ? on : off}" stroke-width="${a ? 7 : 2}" stroke-linecap="round"/>`;
  const lab = (x,y,n,a) => `<text x="${x}" y="${y}" font-size="17" text-anchor="middle" dominant-baseline="central" fill="${a ? '#6f6a50' : off}" font-weight="${a ? 900 : 400}" font-family="Noto Sans TC, sans-serif">${n}</text>${a ? `<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="${on}" stroke-width="2"/>` : ''}`;
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60 4 V24 M60 96 V116 M4 60 H24 M96 60 H116" stroke="${off}" stroke-width="2"/>
    <polygon points="60,24 96,60 60,96 24,60" fill="${fill}"/>
    ${edge(60,24,96,60,b[0])}${edge(96,60,60,96,b[1])}${edge(60,96,24,60,b[2])}${edge(24,60,60,24,b[3])}
    ${last ? `<text x="60" y="60" font-size="16" text-anchor="middle" dominant-baseline="central" fill="${ink}" font-weight="900" font-family="Noto Sans TC, sans-serif">${esc(last)}</text>` : ''}
    ${lab(94,24,1,b[0])}${lab(94,96,2,b[1])}${lab(26,96,3,b[2])}${lab(26,24,4,b[3])}
  </svg>`;
}

/* ---------- 路由 ---------- */
let current = location.hash.slice(1) || 'home';
function route(){ return current; }
function go(to){
  const changed = current !== to; current = to;
  if (changed){ try { history.pushState(null, '', '#' + to); } catch(e){} }
  closeSheet(); render(); if (changed) window.scrollTo(0, 0);
}
function render(){
  const r = route(); const app = $('#app');
  let html;
  if (r === 'notes') html = viewNotes();
  else if (r.startsWith('note-')) html = viewNote(r.slice(5));
  else if (r === 'photos') html = viewPhotos();
  else if (r === 'drinks') html = viewDrinks();
  else if (r === 'game') html = viewGame(today());
  else if (/^game-\d{4}-\d{2}-\d{2}$/.test(r)) html = viewGame(r.slice(5));
  else if (r === 'history') html = viewHistory();
  else if (r === 'calendar') html = viewCalendar();
  else html = viewHome();
  app.innerHTML = html;
}
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener('popstate', () => { current = location.hash.slice(1) || 'home'; closeSheet(); render(); window.scrollTo(0,0); });

        <div><h4>甜度</h4><div class="chips">${SUGAR.map(x => `<button class="chip" data-act="opt" data-k="sugar" data-v="${x}" aria-pressed="${sheetState.sugar === x}">${x}</button>`).join('')}</div></div>
        <div><h4>冰塊</h4><div class="chips">${ICE.map(x => `<button class="chip" data-act="opt" data-k="ice" data-v="${x}" aria-pressed="${sheetState.ice === x}">${x}</button>`).join('')}</div></div>
        ${s.tops.length && !it.name.endsWith('厚片') ? `<div><h4>加料（可複選）</h4><div class="chips">${s.tops.map(t => `<button class="chip" data-act="top" data-v="${esc(t.n)}" aria-pressed="${sheetState.tops.includes(t.n)}">${esc(t.n)} ${t.p == null ? '<small>價格依門市</small>' : '+' + t.p}</button>`).join('')}</div></div>` : ''}
        <div class="row"><input type="text" id="who" placeholder="誰的？（可不填）" value="${esc(sheetState.who)}" aria-label="訂購人" style="flex:1;min-width:8em">
          <span class="stepper"><button data-act="qty" data-n="-1" aria-label="減少">−</button><output>${sheetState.qty}</output><button data-act="qty" data-n="1" aria-label="增加">＋</button></span></div>
        ${other ? `<p class="hint" style="color:#9a2f25">加入後會清掉還沒完成的「${esc(other.name)}」訂單。</p>` : ''}
        <button class="btn primary" data-act="add-line">加入這次訂單 · $${pr(it)*sheetState.qty}</button>
      </div>` : ''}</div>`).join('')}</div>`).join('')}
      <p class="hint menu-none" ${s.items.some(match) ? 'hidden' : ''} style="color:var(--muted);padding:14px 2px">找不到符合的品項。</p></div>
    <div class="cart-bar">
      ${lines.length && sheetState.cartOpen ? `<div class="cart">
        ${lines.map((l,i) => `<div class="cart-line"><span>${esc(l.name)}${esc(topText(l))} ×${l.qty}<small>${l.size ? esc(l.size)+'・' : ''}${esc(l.sugar)}・${esc(l.ice)}${l.who ? '・'+esc(l.who) : ''}</small></span><span>$${l.price*l.qty}${unknownTop(l) ? '+' : ''}</span><button class="x" data-act="rm-line" data-i="${i}" aria-label="移除">×</button></div>`).join('')}
      </div>` : ''}
      <div class="cart-sum">${lines.length
        ? `<button class="cart-toggle" data-act="cart-toggle" aria-expanded="${!!sheetState.cartOpen}">🧾 ${cups} 杯 · $${total}${lines.some(unknownTop) ? '＋加料' : ''} <small>${sheetState.cartOpen ? '收起 ▾' : '看明細 ▴'}</small></button><button class="btn primary small" data-act="submit-order">完成訂單</button>`
        : `<span class="hint" style="color:var(--muted)">點品項選好後按「加入這次訂單」</span><button class="btn small" data-act="close">關閉</button>`}</div>
    </div>`);
}
function orderText(o){
  const n = o.lines.reduce((a,l)=>a+l.qty,0);
  const extra = o.lines.some(unknownTop) ? '（不含價格依門市的加料）' : '';
  return `【${o.store} 訂單】${stamp(o.time)}\n` + o.lines.map((l,i) => `${i+1}. ${l.name}${l.size ? ' '+l.size : ''}${topText(l)} ${l.sugar}${l.ice} ×${l.qty}${l.who ? `（${l.who}）` : ''} $${l.price*l.qty}`).join('\n') + `\n合計 ${n} 杯 $${o.total}${extra}`;
}
function copyText(text){
  const fallback = () => { openSheet(`<h3>複製訂單</h3><p class="sub">自動複製沒成功，請長按下面的文字全選後複製。</p><textarea class="copy-box" id="copy-box" readonly>${esc(text)}</textarea><p><button class="btn" data-act="close">關閉</button></p>`); const b = $('#copy-box'); b.focus(); b.select(); };
  try { navigator.clipboard.writeText(text).then(() => toast('已複製，可以貼到 LINE 群組'), fallback); } catch(e){ fallback(); }
}

function resultSheet(date, i, j){
  sheetState = { date, i, j };
  openSheet(`<h3>第 ${i+1} 棒 · 第 ${j+1} 打席</h3><p class="sub">選擇這個打席的結果</p>
    <div class="result-grid">${RESULTS.map(([r,k]) => `<button class="${k}" data-act="set-ab" data-v="${r}">${r}</button>`).join('')}<button data-act="set-ab" data-v="">清除</button></div>`);
}

function photoSheet(id){
  const p = db.get('photos', []).find(x => x.id === id); if (!p) return;
  openSheet(`<div class="viewer"><img src="${p.src}" alt="${esc(p.caption || '照片')}"></div>
    <p class="sub" style="margin-top:10px">${slash(p.date)}</p>
    <div class="row"><input type="text" id="cap" data-id="${id}" value="${esc(p.caption || '')}" placeholder="幫這張照片寫一句話" aria-label="照片說明" style="flex:1;min-width:8em"></div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn danger small" data-act="del-photo" data-id="${id}">刪除照片</button><button class="btn primary small" data-act="close">完成</button></div>`);
}

/* ---------- 資料操作 ---------- */
function updateGame(date, fn){
  const games = db.get('games', {});
  const g = games[date] || { note:'', rows:[blankRow(), blankRow(), blankRow()] };
  fn(g); games[date] = g; db.set('games', games);
}
let armed = null;
function confirmTwice(el, key, label){
  if (armed === key) { armed = null; return true; }
  armed = key; const old = el.textContent; el.textContent = label;
  setTimeout(() => { if (armed === key){ armed = null; el.textContent = old; } }, 3000);
  return false;
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'scrim'){ if (e.target === el) closeSheet(); return; }
  e.stopPropagation();
  switch (a){
    case 'go': closeSheet(); go(d.to); break;
    case 'close': closeSheet(); break;
    case 'quick': quickSheet(); break;
    case 'go-cal-today': closeSheet(); calDay = today(); calMonth = calDay.slice(0,7); go('calendar'); setTimeout(() => $('#ev-title')?.focus(), 60); break;
    case 'new-note': { const n = { id: uid(), text: '', updated: Date.now() }; db.set('notes', [n, ...db.get('notes', [])]); closeSheet(); go('note-'+n.id); setTimeout(() => $('#note-text')?.focus(), 60); break; }
    case 'del-note': if (confirmTwice(el, 'note'+d.id, '再按一次刪除')){ db.set('notes', db.get('notes', []).filter(n => n.id !== d.id)); toast('已刪除記事'); go('notes'); } break;
    case 'view-photo': photoSheet(d.id); break;
    case 'del-photo': if (confirmTwice(el, 'ph'+d.id, '再按一次刪除')){ db.set('photos', db.get('photos', []).filter(p => p.id !== d.id)); closeSheet(); rerender(); toast('已刪除照片'); } break;
    case 'pick-store': drinkSel = d.id; db.set('drinkSel', drinkSel); rerender(); break;
    case 'menu': drinkSel = d.id; db.set('drinkSel', drinkSel); closeSheet(); rerender(); sheetState = { store: d.id, pick: null, sugar:'微糖', ice:'少冰', size:'L', qty:1, who:'', q:'', tops:[], cartOpen:false }; menuSheet(); break;
    case 'pick-item': sheetState.pick = sheetState.pick === +d.i ? null : +d.i; sheetState.qty = 1; sheetState.tops = []; menuSheet(); break;
    case 'top': { const t = sheetState.tops; const k = t.indexOf(d.v); if (k >= 0) t.splice(k, 1); else t.push(d.v); menuSheet(); break; }
    case 'cart-toggle': sheetState.cartOpen = !sheetState.cartOpen; menuSheet(); break;
    case 'clear-cart': if (confirmTwice(el, 'cart', '確定？')){ cart = { store:null, lines:[] }; saveCart(); rerender(); } break;
    case 'opt': sheetState[d.k] = d.v; menuSheet(); break;
    case 'qty': sheetState.who = $('#who')?.value || ''; sheetState.qty = Math.max(1, Math.min(50, sheetState.qty + +d.n)); menuSheet(); break;
    case 'add-line': {
      const s = STORES.find(x => x.id === sheetState.store); const it = s.items[sheetState.pick]; const name = it.name;
      const both = it.M && it.L, useM = both ? sheetState.size === 'M' : !!it.M && !it.L;
      const tops = sheetState.tops.map(n => ({ n, p: s.tops.find(t => t.n === n)?.p ?? null }));
      const price = (useM ? it.M : it.L) + tops.reduce((a,t) => a + (t.p || 0), 0);
      const size = both ? (useM ? '中杯' : '大杯') : '';
      if (cart.store !== s.id) cart = { store: s.id, lines: [] };
      cart.lines.push({ name, price, size, tops, sugar: sheetState.sugar, ice: sheetState.ice, qty: sheetState.qty, who: ($('#who')?.value || '').trim() });
      saveCart(); rerender();
      sheetState.pick = null; sheetState.who = ''; sheetState.tops = []; menuSheet(); toast(`已加入 ${name}，共 ${cart.lines.reduce((a,l)=>a+l.qty,0)} 杯`); break; }
    case 'rm-line': cart.lines.splice(+d.i, 1); saveCart(); rerender(); menuSheet(); break;
    case 'submit-order': {
      const s = STORES.find(x => x.id === cart.store); if (!s || !cart.lines.length) break;
      const o = { id: uid(), store: s.name, time: Date.now(), lines: cart.lines, total: cartTotal() };
      db.set('orders', [o, ...db.get('orders', [])].slice(0, 30)); cart = { store:null, lines:[] }; saveCart();
      closeSheet(); rerender(); copyText(orderText(o)); break; }
    case 'copy-order': { const o = db.get('orders', []).find(x => x.id === d.id); if (o) copyText(orderText(o)); break; }
    case 'del-order': db.set('orders', db.get('orders', []).filter(o => o.id !== d.id)); rerender(); break;
    case 'base': updateGame(d.date, g => { const r = g.rows[+d.i]; const q = +d.q - 1; const on = !r.bases[q];
        r.bases = r.bases.map((v,k) => on ? (k <= q ? 1 : v) : (k >= q ? 0 : v)); }); rerender(); break;
    case 'ab': resultSheet(d.date, +d.i, +d.j); break;
    case 'set-ab': { const { date, i, j } = sheetState; updateGame(date, g => {
        const r = g.rows[i]; const wasLast = lastAbIndex(r) <= j;
        r.ab[j] = d.v;
        // 只有改到最後一個打席（或清掉它）時，才依最新結果重設壘包
        if (wasLast){ const n = BASES_FOR[lastAb(r)] || 0; r.bases = [0,1,2,3].map(k => k < n ? 1 : 0); }
      }); closeSheet(); rerender(); break; }
    case 'add-row': updateGame(d.date, g => g.rows.push(blankRow())); rerender(); break;
    case 'del-row': if (confirmTwice(el, 'row'+d.date+d.i, '確定？')){ updateGame(d.date, g => g.rows.splice(+d.i, 1)); rerender(); } break;
    case 'cal-move': { const [y,m] = calMonth.split('-').map(Number); const nd = new Date(y, m-1 + +d.n, 1); calMonth = `${nd.getFullYear()}-${pad(nd.getMonth()+1)}`; rerender(); break; }
    case 'cal-day': calDay = d.d; calMonth = calDay.slice(0,7); rerender(); break;
    case 'del-ev': { const ev = db.get('events', {}); ev[calDay] = (ev[calDay] || []).filter(x => x.id !== d.id); if (!ev[calDay].length) delete ev[calDay]; db.set('events', ev); rerender(); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.store[role=button]')){ e.preventDefault(); e.target.click(); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'note-text'){ const notes = db.get('notes', []); const n = notes.find(x => x.id === t.dataset.id); if (n){ n.text = t.value; n.updated = Date.now(); db.set('notes', notes); } }
  else if (t.id === 'game-note') updateGame(t.dataset.date, g => { g.note = t.value; });
  else if (t.classList.contains('batter-name')) updateGame(t.dataset.date, g => { g.rows[+t.dataset.i].name = t.value; });
  else if (t.id === 'cap'){ const ps = db.get('photos', []); const p = ps.find(x => x.id === t.dataset.id); if (p){ p.caption = t.value; db.set('photos', ps); } }
  else if (t.id === 'who' && sheetState) sheetState.who = t.value;
  else if (t.id === 'menu-q' && sheetState){
    const q = sheetState.q = t.value.trim();
    document.querySelectorAll('.mi-cat').forEach(cat => {
      let any = false;
      cat.querySelectorAll('.mi').forEach(mi => { const ok = !q || mi.dataset.name.includes(q); mi.hidden = !ok; any = any || ok; });
      cat.hidden = !any;
    });
    const none = $('.menu-none'); if (none) none.hidden = !!document.querySelector('.mi-cat:not([hidden])');
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'game-date' && t.value) go('game-' + t.value);
  if (t.id === 'photo-input' && t.files[0]) addPhoto(t.files[0]);
  if (t.id === 'cap') rerender();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'ev-form') return;
  e.preventDefault();
  const title = $('#ev-title').value.trim(); if (!title) return;
  const ev = db.get('events', {}); (ev[calDay] = ev[calDay] || []).push({ id: uid(), time: $('#ev-time').value, title });
  db.set('events', ev); rerender(); toast('已加入行程');
});

/* 照片縮小後存起來 */
function addPhoto(file){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const p = { id: uid(), src: c.toDataURL('image/jpeg', .78), date: today(), caption: '' };
      const ok = db.set('photos', [p, ...db.get('photos', [])]);
      rerender(); toast(ok ? '照片已存好' : '手機空間不足，這張照片只會保留到關閉頁面為止');
      photoSheet(p.id);
    };
    img.onerror = () => toast('這個檔案無法讀成圖片，請換一張');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

render();
})();
</script>
